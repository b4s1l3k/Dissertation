version: '3.8'

services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra-container
    ports:
      - "9042:9042"
    networks:
      - cassandra-network
    environment:
      CASSANDRA_CLUSTER_NAME: DissertationCluster
      CASSANDRA_NUM_TOKENS: 256
      MAX_HEAP_SIZE: 5120M
      HEAP_NEWSIZE: 1000M
    volumes:
      - cassandra_data:/var/lib/cassandra

networks:
  cassandra-network:
    driver: bridge

volumes:
  cassandra_data:
    driver: local