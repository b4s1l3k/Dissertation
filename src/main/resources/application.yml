spring:
  main:
    web-application-type: none
  data:
    cassandra:
      contact-points: cassandra-container
      port: 9042
      keyspace-name: dissertation
      schema-action: create-if-not-exists
      username: cassandra
      password: cassandra
      local-datacenter: datacenter1

compression:
  lz4:
    blockSize: 65536
  snappy:
    blockSize: 6553600
  zstd:
    compressionLevel: 1
    enableChecksum: false

generating:
  userProfiles:
    count: 1000000
  payments:
    count: 1000000
  orders:
    count: 1000000

application:
  applicationType:
    type: compression # cassandra, generating, compression, generatingPlusCompression